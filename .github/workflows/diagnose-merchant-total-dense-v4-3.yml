name: Diagnose Merchant Total Dense v4.3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose_merchant_total_dense_v4_3.py'
      - '.github/workflows/diagnose-merchant-total-dense-v4-3.yml'
      - 'data/merchant_v4_3/merchant_total_feature_panel_v4_3.csv'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -r requirements-training.txt
      - name: Run dense diagnostic
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python scripts/diagnose_merchant_total_dense_v4_3.py
      - name: Show evidence
        if: always()
        run: cat reports/merchant_total_hybrid_v4_3/dense_diagnostic.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: merchant-total-dense-v4-3-diagnostic
          path: reports/merchant_total_hybrid_v4_3/dense_diagnostic.json
          if-no-files-found: warn
          retention-days: 90
      - name: Persist evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/merchant_total_hybrid_v4_3/dense_diagnostic.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'diagnostic: persist merchant-total dense downside evidence'
          git pull --rebase origin main
          git push origin HEAD:main
