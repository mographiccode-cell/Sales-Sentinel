name: Train Sales Sentinel Production v2.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/train_sales_sentinel_production_v2_0.py'
      - 'scripts/run_sales_sentinel_production_v2_0.py'
      - '.github/workflows/train-sales-sentinel-production-v2-0.yml'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements-training.txt
          pip install xgboost
      - name: Verify frozen development inputs only
        run: |
          test -f data/sama_pos/sama_sector_weekly_value_count_2020_2025.csv
          test -f data/sama_pos/sama_sector_walkforward_forecasts_2023_2025.csv
      - name: Train frozen production triage
        run: python scripts/run_sales_sentinel_production_v2_0.py
      - name: Show development evidence
        run: |
          cat reports/sales_sentinel_v2_0/development_summary.md
          python - <<'PY'
          import json
          d=json.load(open('reports/sales_sentinel_v2_0/development_report.json',encoding='utf-8'))
          assert d['separation']['fresh_holdout_not_used'] is True
          assert d['leakage_controls']['future_actual_SAMA_as_feature'] is False
          print(json.dumps({
            'selected':d['selected_score'],
            'rows':d['development_rows'],
            'positive_rate':d['development_positive_rate'],
            'triage':d['policy_window_triage'],
            'ranking':d['policy_window_ranking'],
            'calibration':d['policy_window_calibration'],
            'gates':d['development_gates'],
            'all_gates':d['development_all_gates_passed'],
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sales-sentinel-production-v2-0-frozen
          path: |
            reports/sales_sentinel_v2_0/**
            models/sales_sentinel_v2_0/**
          retention-days: 30
      - name: Persist frozen development model and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/sales_sentinel_v2_0 models/sales_sentinel_v2_0
          git diff --cached --quiet || git commit -m 'ml: persist frozen Sales Sentinel v2.0 development model'
          git pull --rebase origin main
          git push origin HEAD:main
