name: Train SAMA City Risk v3.4.3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/train_sama_city_risk_v3_4_3.py'
      - '.github/workflows/train-sama-city-risk-v3-4-3.yml'
      - 'models/sama_city_v3_3/**'

permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          pip install -r requirements-training.txt
          pip install xgboost
      - name: Train v3.4.3
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python scripts/train_sama_city_risk_v3_4_3.py
      - name: Show evidence
        if: always()
        run: |
          test -f reports/sama_city_v3_4_3/development_summary.md && cat reports/sama_city_v3_4_3/development_summary.md || true
          test -f reports/sama_city_v3_4_3/development_report.json && cat reports/sama_city_v3_4_3/development_report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sales-sentinel-v3-4-3-training
          path: |
            reports/sama_city_v3_4_3/**
            models/sama_city_v3_4_3/**
          if-no-files-found: warn
          retention-days: 90
      - name: Persist evidence/model
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/sama_city_v3_4_3 models/sama_city_v3_4_3 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'model: persist Sales Sentinel v3.4.3 multi-horizon evidence'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Enforce gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('reports/sama_city_v3_4_3/development_report.json').read_text())
          assert d.get('all_gates_passed') is True, d
          PY
