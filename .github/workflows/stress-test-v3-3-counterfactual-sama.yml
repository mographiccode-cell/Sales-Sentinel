name: Stress Test v3.3 Counterfactual SAMA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/stress_test_v3_3_counterfactual_sama.py'
      - 'scripts/production_city_risk_engine_v3.py'
      - '.github/workflows/stress-test-v3-3-counterfactual-sama.yml'
      - 'models/sama_city_v3_3/**'

permissions:
  contents: write

jobs:
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          pip install -r requirements-training.txt
          pip install xgboost
      - name: Run frozen counterfactual SAMA stress test
        id: stress_test
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python scripts/stress_test_v3_3_counterfactual_sama.py
      - name: Show evidence
        if: always()
        run: cat reports/sama_city_v3_3/counterfactual_stress/summary.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sales-sentinel-v3-3-counterfactual-sama
          path: reports/sama_city_v3_3/counterfactual_stress/**
          retention-days: 90
      - name: Persist evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/sama_city_v3_3/counterfactual_stress
          git diff --cached --quiet || git commit -m 'test: persist v3.3 counterfactual SAMA evidence'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Enforce acceptance gate
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('reports/sama_city_v3_3/counterfactual_stress/report.json')
          d=json.loads(p.read_text())
          print('all_acceptance_passed=', d['all_acceptance_passed'])
          sys.exit(0 if d['all_acceptance_passed'] else 2)
          PY
