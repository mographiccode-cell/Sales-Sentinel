name: Inspect V18 Metrics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v18-metrics.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print V18 artifact metadata
        run: |
          python - <<'PY'
          import gzip, json, pprint
          with gzip.open('models/sales_sentinel_portable_v18.json.gz','rt',encoding='utf-8') as f:
              a=json.load(f)
          print('TOP_LEVEL_KEYS=', sorted(a.keys()))
          for k in ['version','model_type','decision_policy','history_required_days','evidence','scientific_status','target_definition','classes']:
              if k in a:
                  print(f'{k.upper()}=')
                  pprint.pp(a[k], width=180)
          PY
