name: Quick Inspect SAMA City Layout v2.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/quick_inspect_sama_city_layout_v2_1.py'
      - '.github/workflows/quick-inspect-sama-city-layout-v2-1.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          pip install requests==2.32.5
      - run: python scripts/quick_inspect_sama_city_layout_v2_1.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/sama_city_v2_1/quick_pdf_layout.json
          git diff --cached --quiet || git commit -m 'data: persist direct SAMA city layout inspection'
          git pull --rebase origin main
          git push origin HEAD:main
