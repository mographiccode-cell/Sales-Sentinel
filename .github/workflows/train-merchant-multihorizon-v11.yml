name: Train Merchant Multi-Horizon V11

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/train_merchant_multihorizon_v11.py'
      - '.github/workflows/train-merchant-multihorizon-v11.yml'

jobs:
  train-v11:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn xgboost catboost
      - name: Train V11 multi-horizon verifier
        run: python scripts/train_merchant_multihorizon_v11.py
      - name: Show V11 summary
        run: cat reports/merchant_multihorizon_v11/development_summary.md
      - name: Upload V11 evidence
        uses: actions/upload-artifact@v4
        with:
          name: merchant-multihorizon-v11
          path: reports/merchant_multihorizon_v11/
      - name: Persist V11 evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/merchant_multihorizon_v11
          git diff --cached --quiet || git commit -m "Persist V11 multi-horizon evidence"
          git push
