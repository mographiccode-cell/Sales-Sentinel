name: Build Conformal Policy v2.3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_conformal_policy_v2_3.py'
      - '.github/workflows/build-conformal-policy-v2-3.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          pip install -r requirements-training.txt
          pip install xgboost
      - name: Verify frozen v2.2 base
        run: |
          python - <<'PY'
          import json
          d=json.load(open('reports/sama_city_v2_2/development_report.json',encoding='utf-8'))
          assert d['all_gates_passed'] is True
          assert d['leakage_controls']['fresh_2025_2026_used'] is False
          PY
      - name: Build rolling conformal policy on historical OOF only
        run: python scripts/build_conformal_policy_v2_3.py
      - name: Show evidence
        run: cat reports/sama_city_v2_3/policy_development_summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: sama-city-risk-v2-3-conformal-policy
          path: |
            reports/sama_city_v2_3/**
            models/sama_city_v2_3/**
          retention-days: 30
      - name: Persist policy and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/sama_city_v2_3 models/sama_city_v2_3
          git diff --cached --quiet || git commit -m 'ml: persist rolling conformal policy v2.3'
          git stash push --include-untracked -m 'ci-generated-nonpolicy-artifacts' || true
          git pull --rebase origin main
          git push origin HEAD:main
