name: Acquire SAMA Recent Holdout v2.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/scrape_sama_recent_pos_reports_v2_0.py'
      - '.github/workflows/sama-recent-holdout-v2-0.yml'

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install requests==2.32.5
      - name: Scrape and download recent official SAMA reports
        run: python scripts/scrape_sama_recent_pos_reports_v2_0.py
      - name: Show manifest summary
        run: |
          python - <<'PY'
          import json
          p='reports/sama_recent_v2_0/source_manifest.json'
          d=json.load(open(p,encoding='utf-8'))
          print('downloaded_pdfs=',d['downloaded_pdfs'])
          for x in d['downloads'][:20]: print(x)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sama-recent-holdout-v2-0
          path: |
            artifacts/sama_recent_v2_0/**
            reports/sama_recent_v2_0/**
          retention-days: 30
      - name: Persist manifest only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/sama_recent_v2_0/source_manifest.json
          git diff --cached --quiet || git commit -m 'data: persist SAMA recent holdout manifest'
          git pull --rebase origin main
          git push origin HEAD:main
