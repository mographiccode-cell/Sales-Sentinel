name: Train SAMA Sector Decline v1.9

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/train_sama_sector_decline_v1_9.py'
      - '.github/workflows/train-sama-sector-decline-v1-9.yml'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements-training.txt
          pip install xgboost
      - name: Verify inputs
        run: |
          test -f data/sama_pos/sama_sector_weekly_value_count_2020_2025.csv
          test -f data/sama_pos/sama_sector_walkforward_forecasts_2023_2025.csv
      - name: Train and evaluate
        run: python scripts/train_sama_sector_decline_v1_9.py
      - name: Show evidence
        run: |
          cat reports/sama_sector_decline_v1_9/summary.md
          cat reports/sama_sector_decline_v1_9/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: sama-sector-decline-v1-9
          path: |
            reports/sama_sector_decline_v1_9/**
            models/sama_sector_decline_v1_9/**
          retention-days: 30
      - name: Persist evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/sama_sector_decline_v1_9 models/sama_sector_decline_v1_9
          git diff --cached --quiet || git commit -m 'ml: persist SAMA sector decline v1.9 evidence'
          git stash push --include-untracked -m 'ci-leftovers' || true
          git pull --rebase origin main
          git push origin HEAD:main
