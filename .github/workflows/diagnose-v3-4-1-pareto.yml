name: Diagnose v3.4.1 Pareto

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose_v3_4_1_pareto.py'
      - '.github/workflows/diagnose-v3-4-1-pareto.yml'

permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          pip install -r requirements-training.txt
          pip install xgboost
      - name: Diagnose
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python scripts/diagnose_v3_4_1_pareto.py
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/sama_city_v3_4_1/trend_pareto_diagnostic.json
          git diff --cached --quiet || git commit -m 'diagnostic: persist v3.4.1 Pareto limits'
          git pull --rebase origin main
          git push origin HEAD:main
