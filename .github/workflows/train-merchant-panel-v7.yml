name: Train Merchant Panel V7

on:
  push:
    branches: [main]
    paths:
      - 'scripts/train_merchant_panel_v7.py'
      - '.github/workflows/train-merchant-panel-v7.yml'
      - 'data/merchant_v4/merchant_sector_daily_features_v4.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-v7:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-training.txt
      - name: Train V7 panel model with blind holdout
        run: python scripts/train_merchant_panel_v7.py
      - name: Show final summary
        run: cat reports/merchant_panel_v7/development_summary.md
      - name: Upload V7 evidence
        uses: actions/upload-artifact@v4
        with:
          name: sales-sentinel-v7-evidence
          path: |
            reports/merchant_panel_v7/
            data/merchant_v7/
            models/merchant_panel_v7/
      - name: Persist V7 evidence and model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/merchant_panel_v7 data/merchant_v7 models/merchant_panel_v7
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Persist Sales Sentinel V7 blind-holdout results'
            git push
          fi
