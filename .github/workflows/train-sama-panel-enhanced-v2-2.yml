name: Train SAMA panel enhanced v2.2

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/train_sama_panel_enhanced_v2_2.py'
      - '.github/workflows/train-sama-panel-enhanced-v2-2.yml'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install pandas==2.2.3 numpy==2.2.4 scikit-learn==1.6.1 xgboost==3.0.2 joblib
      - name: Apply deterministic overlap dtype fix
        run: sed -i "s/np.zeros(len(series), dtype=float)/np.zeros(len(series), dtype=bool)/" scripts/train_sama_panel_enhanced_v2_2.py
      - name: Verify official SAMA data
        run: test -f data/sama_pos/sama_pos_2020_2025_normalized.csv
      - name: Train enhanced ensemble and walk-forward evaluate
        run: python scripts/train_sama_panel_enhanced_v2_2.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: sama-panel-enhanced-v2-2
          path: |
            models/sama_panel_v2_2/**
            reports/sama_panel_v2_2/**
      - name: Persist source fix, model and reports
        run: |
          git config user.name "Sales Sentinel CI"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/train_sama_panel_enhanced_v2_2.py models/sama_panel_v2_2 reports/sama_panel_v2_2
          if ! git diff --cached --quiet; then
            git commit -m "ml: persist enhanced SAMA ensemble v2.2 results"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
