name: Test Live Vercel

on:
  workflow_dispatch:

jobs:
  live-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate production aliases
        shell: bash
        run: |
          set +e
          for url in \
            "https://sales-sentinel-ppgm.vercel.app/" \
            "https://sales-sentinel.vercel.app/"; do
            echo "===== $url ====="
            code=$(curl -L -sS --max-time 30 -o /tmp/body.txt -w "%{http_code}" "$url")
            echo "HTTP $code"
            head -c 1200 /tmp/body.txt || true
            echo
          done
