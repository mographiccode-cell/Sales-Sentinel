name: Test Live Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'vercel.json'
      - '.vercelignore'
      - '.github/workflows/test-live-vercel.yml'

jobs:
  live-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Probe stable aliases and latest successful deployment
        shell: bash
        run: |
          set +e
          urls=(
            "https://sales-sentinel-ppgm.vercel.app/"
            "https://sales-sentinel-ppgm.vercel.app/__probe"
            "https://sales-sentinel-ppgm-t8mdvf0th-mographiccode.vercel.app/"
            "https://sales-sentinel-ppgm-t8mdvf0th-mographiccode.vercel.app/__probe"
            "https://sales-sentinel-mographiccode.vercel.app/"
          )
          failed=0
          for url in "${urls[@]}"; do
            echo "===== $url ====="
            code=$(curl -L -sS --max-time 30 -o /tmp/body.txt -w "%{http_code}" "$url")
            echo "HTTP $code"
            head -c 1600 /tmp/body.txt || true
            echo
            if [ "$code" = "500" ]; then failed=1; fi
          done
          exit $failed
