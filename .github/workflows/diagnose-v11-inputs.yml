name: Diagnose V11 Inputs

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/diagnose_v11_inputs.py'
      - '.github/workflows/diagnose-v11-inputs.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy
      - name: Diagnose current Saudi panels
        run: python scripts/diagnose_v11_inputs.py
      - name: Show summary
        run: cat reports/v11_input_diagnostics/summary.md
      - name: Persist diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/v11_input_diagnostics
          git diff --cached --quiet || git commit -m "Persist V11 input diagnostics"
          git push
