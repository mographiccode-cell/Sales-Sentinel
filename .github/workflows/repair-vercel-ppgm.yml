name: Repair Vercel PPGM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-vercel-ppgm.yml'

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Vercel token availability
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN_MISSING"
            exit 2
          fi
          echo "VERCEL_TOKEN_PRESENT"
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Link project
        run: vercel link --yes --project sales-sentinel-ppgm --scope mographiccode --token "$VERCEL_TOKEN"
      - name: Inspect current production runtime errors
        continue-on-error: true
        run: vercel logs --environment production --source serverless --since 1h --level error --expand --token "$VERCEL_TOKEN"
      - name: Redeploy current source to production
        id: deploy
        run: |
          url=$(vercel deploy --prod --yes --token "$VERCEL_TOKEN" | tail -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "DEPLOYED_URL=$url"
      - name: Verify production root and health
        run: |
          vercel curl / --deployment "${{ steps.deploy.outputs.url }}" --token "$VERCEL_TOKEN" -- --fail-with-body
          vercel curl /healthz --deployment "${{ steps.deploy.outputs.url }}" --token "$VERCEL_TOKEN" -- --fail-with-body
