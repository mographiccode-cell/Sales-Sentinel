name: Stress Test Prior Shift v2.4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'models/sama_city_v2_4/prior_shift_policy_v2_4.joblib'
      - 'scripts/stress_test_prior_shift_policy_v2_4.py'
      - '.github/workflows/stress-test-prior-shift-v2-4.yml'

permissions:
  contents: write

jobs:
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          pip install -r requirements-training.txt
          pip install xgboost
      - name: Verify frozen base and historical-only policy
        run: |
          python - <<'PY'
          import json, joblib
          b=json.load(open('reports/sama_city_v2_2/development_report.json',encoding='utf-8'))
          p=json.load(open('reports/sama_city_v2_4/policy_development_report.json',encoding='utf-8'))
          a=joblib.load('models/sama_city_v2_4/prior_shift_policy_v2_4.joblib')
          assert b['all_gates_passed'] is True
          assert b['leakage_controls']['fresh_2025_2026_used'] is False
          assert p['all_gates_passed'] is True
          assert p['controls']['no_fresh_2025_2026_labels_used'] is True
          assert a['version']=='SAMA-CITY-RISK-2.4-PRIOR-SHIFT'
          PY
      - name: Run prequential stress test with fixed policy
        run: python scripts/stress_test_prior_shift_policy_v2_4.py
      - name: Show evidence
        run: cat reports/sama_city_v2_4/post_diagnosis_prequential_stress.md
      - uses: actions/upload-artifact@v4
        with:
          name: sama-city-risk-v2-4-prior-shift-stress
          path: reports/sama_city_v2_4/**
          retention-days: 30
      - name: Persist stress evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/sama_city_v2_4/post_diagnosis_prequential_stress.json reports/sama_city_v2_4/post_diagnosis_prequential_stress.md
          git diff --cached --quiet || git commit -m 'ml: persist v2.4 prior-shift stress evidence'
          git stash push --include-untracked -m 'ci-generated-nonstress-artifacts' || true
          git pull --rebase origin main
          git push origin HEAD:main
