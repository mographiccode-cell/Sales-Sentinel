name: Verify Production City Risk Engine v2.4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/production_city_risk_engine_v2_4.py'
      - 'scripts/verify_production_city_risk_engine_v2_4.py'
      - '.github/workflows/verify-production-city-risk-engine-v2-4.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          pip install -r requirements-training.txt
          pip install xgboost
      - name: Verify serving parity, leakage and fail-closed behavior
        run: python scripts/verify_production_city_risk_engine_v2_4.py
      - name: Run pytest guards
        run: pytest -q tests/test_production_city_risk_engine_v2_4.py
      - name: Show verification
        run: cat reports/sama_city_v2_4/production_engine_verification.json
      - name: Persist verification evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/sama_city_v2_4/production_engine_verification.json
          git diff --cached --quiet || git commit -m 'test: persist production v2.4 engine verification'
          git stash push --include-untracked -m 'ci-generated-nonverification' || true
          git pull --rebase origin main
          git push origin HEAD:main
