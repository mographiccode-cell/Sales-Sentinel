name: Export Local Runtime Artifact

on:
  push:
    branches: [local-execution-artifact]
    paths:
      - '.github/workflows/export-local-artifact.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare runtime bundle
        run: |
          rm -rf runtime-bundle
          mkdir runtime-bundle
          cp -R app api models data runtime-bundle/
          cp requirements.txt main.py vercel.json .python-version runtime-bundle/
      - uses: actions/upload-artifact@v4
        with:
          name: sales-sentinel-runtime
          path: runtime-bundle
          compression-level: 9
