name: Train Merchant Meta Verifier V9.2

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/train_merchant_meta_verifier_v9_2.py'
      - '.github/workflows/train-merchant-meta-verifier-v9-2.yml'

jobs:
  train-v9-2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas scikit-learn xgboost catboost
      - name: Train V9.2 meta verifier
        run: python scripts/train_merchant_meta_verifier_v9_2.py
      - name: Show V9.2 summary
        run: cat reports/merchant_meta_verifier_v9_2/development_summary.md
      - name: Upload V9.2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: merchant-meta-verifier-v9-2
          path: reports/merchant_meta_verifier_v9_2/
      - name: Persist V9.2 evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/merchant_meta_verifier_v9_2
          git diff --cached --quiet || git commit -m "Persist V9.2 meta verifier evidence"
          git push
