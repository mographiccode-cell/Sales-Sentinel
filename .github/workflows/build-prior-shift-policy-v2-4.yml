name: Build Prior Shift Policy v2.4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_prior_shift_policy_v2_4.py'
      - '.github/workflows/build-prior-shift-policy-v2-4.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          pip install -r requirements-training.txt
          pip install xgboost
      - name: Verify frozen stationary base
        run: |
          python - <<'PY'
          import json
          d=json.load(open('reports/sama_city_v2_2/development_report.json',encoding='utf-8'))
          assert d['all_gates_passed'] is True
          assert d['leakage_controls']['fresh_2025_2026_used'] is False
          PY
      - name: Build historical-only prior-shift policy
        run: python scripts/build_prior_shift_policy_v2_4.py
      - name: Show evidence
        run: cat reports/sama_city_v2_4/policy_development_summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: sama-city-risk-v2-4-prior-shift
          path: |
            reports/sama_city_v2_4/**
            models/sama_city_v2_4/**
          retention-days: 30
      - name: Persist policy and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/sama_city_v2_4 models/sama_city_v2_4
          git diff --cached --quiet || git commit -m 'ml: persist prior-shift risk policy v2.4'
          git stash push --include-untracked -m 'ci-generated-nonpolicy-artifacts' || true
          git pull --rebase origin main
          git push origin HEAD:main
