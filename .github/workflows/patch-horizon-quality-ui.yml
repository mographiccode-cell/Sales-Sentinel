name: Patch Horizon Quality Semantics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-horizon-quality-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch primary forecast quality to horizon-total WAPE
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/services/instant_analysis.py')
          s = p.read_text(encoding='utf-8')
          old = '''    wape = metrics.get("wape")\n    wape = float(wape) if wape is not None else None\n    return {\n        "model_name": first.get("model_name", "—"),\n        "model_version": first.get("model_version", "—"),\n        "accuracy_proxy_pct": max(0.0, min(100.0, (1.0 - wape) * 100.0)) if wape is not None else None,\n        "error_wape_pct": max(0.0, wape * 100.0) if wape is not None else None,'''
          new = '''    daily_wape = metrics.get("wape")\n    daily_wape = float(daily_wape) if daily_wape is not None else None\n    horizon_wape = metrics.get("horizon_total_wape")\n    horizon_wape = float(horizon_wape) if horizon_wape is not None else None\n    primary_wape = horizon_wape if horizon_wape is not None else daily_wape\n    return {\n        "model_name": first.get("model_name", "—"),\n        "model_version": first.get("model_version", "—"),\n        "accuracy_proxy_pct": max(0.0, min(100.0, (1.0 - primary_wape) * 100.0)) if primary_wape is not None else None,\n        "error_wape_pct": max(0.0, primary_wape * 100.0) if primary_wape is not None else None,\n        "daily_wape_pct": max(0.0, daily_wape * 100.0) if daily_wape is not None else None,\n        "horizon_total_wape_pct": max(0.0, horizon_wape * 100.0) if horizon_wape is not None else None,\n        "horizon_backtest_folds": int(metrics.get("horizon_backtest_folds") or 0),'''
          if old not in s:
              raise SystemExit('instant_analysis quality fragment not found')
          s = s.replace(old, new, 1)
          s = s.replace('"point_forecast_selection": "merchant_rolling_wape"', '"point_forecast_selection": "merchant_horizon_total_wape_then_daily_wape"')
          p.write_text(s, encoding='utf-8')

          p = Path('app/forecasting/routes.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('"point_forecast_selection": "merchant_rolling_wape"', '"point_forecast_selection": "merchant_horizon_total_wape_then_daily_wape"')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit quality semantics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/services/instant_analysis.py app/forecasting/routes.py
          git diff --cached --quiet || git commit -m 'fix: use horizon-total WAPE as primary forecast quality'
          git pull --rebase origin main
          git push origin HEAD:main
