name: Test Protected Vercel With OIDC

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-vercel-oidc.yml'

permissions:
  contents: read
  id-token: write

jobs:
  protected-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Obtain GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);
      - name: Probe team-qualified protected deployment
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -e
          for path in / /__probe; do
            url="https://sales-sentinel-ppgm-mographiccode.vercel.app${path}"
            echo "===== $url ====="
            code=$(curl -L -sS --max-time 30 \
              -H "x-vercel-trusted-oidc-idp-token: $OIDC_TOKEN" \
              -o /tmp/body.txt -w "%{http_code}" "$url")
            echo "HTTP $code"
            head -c 1600 /tmp/body.txt || true
            echo
            test "$code" = "200"
          done
