name: Audit Saudi Kaggle Store Sales
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_saudi_kaggle_store_sales.py'
      - '.github/workflows/audit-saudi-kaggle-store-sales.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.2.3 numpy==2.2.4 openpyxl==3.1.5 requests==2.32.5
      - run: python scripts/audit_saudi_kaggle_store_sales.py
      - run: cat reports/saudi_kaggle_candidate/audit.md
      - name: Persist audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/saudi_kaggle_candidate
          git diff --cached --quiet || git commit -m 'data: persist Saudi Kaggle candidate audit'
          git pull --rebase origin main
          git push origin HEAD:main
