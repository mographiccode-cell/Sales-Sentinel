name: Calibrate SAMA Decline Alert v1.8.1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/calibrate_sama_decline_alert_v1_8_1.py'
      - '.github/workflows/calibrate-sama-decline-alert-v1-8-1.yml'
permissions:
  contents: write
jobs:
  calibrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas==2.2.3 numpy==2.2.4 scikit-learn==1.6.1
      - run: python scripts/calibrate_sama_decline_alert_v1_8_1.py
      - run: cat reports/sama_sector_v1_8_1/calibrated_sama_decline_alert_v1_8_1.md
      - name: Persist report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/sama_sector_v1_8_1
          git diff --cached --quiet || git commit -m 'ml: persist calibrated SAMA decline alert v1.8.1'
          git pull --rebase origin main
          git push origin HEAD:main
