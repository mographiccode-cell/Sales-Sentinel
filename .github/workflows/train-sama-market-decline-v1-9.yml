name: Train SAMA Market Decline v1.9

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/train_sama_market_decline_v1_9.py'
      - '.github/workflows/train-sama-market-decline-v1-9.yml'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          pip install pandas==2.2.3 numpy==2.2.4 scikit-learn==1.6.1 joblib xgboost
      - name: Train with 2023 only and test 2024-2025
        run: python scripts/train_sama_market_decline_v1_9.py
      - name: Show evidence
        run: cat reports/sama_market_v1_9/sama_market_decline_v1_9.md
      - uses: actions/upload-artifact@v4
        with:
          name: sama-market-decline-v1-9
          path: |
            reports/sama_market_v1_9/**
            models/sama_market_v1_9/**
          retention-days: 30
      - name: Persist model and report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/sama_market_v1_9 models/sama_market_v1_9
          git diff --cached --quiet || git commit -m 'ml: persist SAMA market decline v1.9'
          git pull --rebase origin main
          git push origin HEAD:main
