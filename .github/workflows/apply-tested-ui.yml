name: Apply Locally Validated UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-tested-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Apply validated files
        shell: bash
        run: |
          cat > /tmp/ui_patch.b64 <<'B64'


B64
          base64 -d /tmp/ui_patch.b64 > /tmp/ui_patch.tar.gz
          echo 'ded462e6eb159e757bda0940f41cbb219658dfabc131343d7b6bacb0527e21a4  /tmp/ui_patch.tar.gz' | sha256sum -c -
          tar -xzf /tmp/ui_patch.tar.gz -C .
          rm -f .github/workflows/export-local-artifact.yml .github/workflows/export-local-deps.yml .github/workflows/apply-tested-ui.yml
          git config user.name 'MahmoudDev'
          git config user.email 'mographiccode@gmail.com'
          git add app .github/workflows
          git commit -m 'feat: show instant sales predictions and reports after upload'
          git push origin HEAD:main
