name: Train Merchant Multi-Resolution v7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/train_merchant_multiresolution_v7.py'
      - '.github/workflows/train-merchant-multiresolution-v7.yml'
      - 'data/saudi_v1_5/saudi_sector_daily_panel_v1_5.csv.gz'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install training dependencies
        run: pip install -r requirements-training.txt
      - name: Train and open frozen v7 internal holdout
        run: python scripts/train_merchant_multiresolution_v7.py
      - name: Show v7 evidence
        if: always()
        run: |
          test -f reports/merchant_multiresolution_v7/development_summary.md && cat reports/merchant_multiresolution_v7/development_summary.md || true
          test -f reports/merchant_multiresolution_v7/development_report.json && cat reports/merchant_multiresolution_v7/development_report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sales-sentinel-merchant-multiresolution-v7
          path: |
            reports/merchant_multiresolution_v7/**
            models/merchant_multiresolution_v7/**
          if-no-files-found: warn
          retention-days: 90
      - name: Persist v7 evidence and model
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/merchant_multiresolution_v7 models/merchant_multiresolution_v7 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'model: persist Sales Sentinel v7 multi-resolution evidence'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Enforce scientific integrity only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('reports/merchant_multiresolution_v7/development_report.json')
          assert p.exists(), 'v7 development report missing'
          d = json.loads(p.read_text())
          assert d.get('all_scientific_integrity_gates_passed') is True, json.dumps(d.get('scientific_integrity_gates', {}), indent=2)
          print('V7 scientific integrity gates: PASS')
          print('Performance gates:', d.get('blind_holdout', {}).get('all_performance_gates_passed'))
          PY
