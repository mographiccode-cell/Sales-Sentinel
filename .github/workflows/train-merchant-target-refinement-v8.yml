name: Train Merchant Target Refinement V8

on:
  push:
    paths:
      - 'scripts/train_merchant_target_refinement_v8.py'
      - '.github/workflows/train-merchant-target-refinement-v8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-v8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas scikit-learn catboost xgboost
      - name: Train V8 target refinement
        run: python scripts/train_merchant_target_refinement_v8.py
      - name: Show V8 summary
        run: cat reports/merchant_target_refinement_v8/development_summary.md
      - name: Upload V8 evidence
        uses: actions/upload-artifact@v4
        with:
          name: merchant-target-refinement-v8
          path: reports/merchant_target_refinement_v8/
      - name: Persist V8 evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/merchant_target_refinement_v8/
          git diff --cached --quiet || git commit -m "Persist V8 target refinement evidence"
          git push
