name: Inspect External Saudi Store Sales

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/inspect_external_saudi_store_sales.py'
      - '.github/workflows/inspect-external-saudi-store-sales.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install inspection dependencies
        run: pip install pandas numpy openpyxl pyarrow
      - name: Download public Kaggle dataset
        run: |
          mkdir -p /tmp/saudi_store_sales
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://www.kaggle.com/api/v1/datasets/download/shilton123456/sales-in-saudi-arabia' \
            -o /tmp/saudi_store_sales.zip
          unzip -o /tmp/saudi_store_sales.zip -d /tmp/saudi_store_sales
          find /tmp/saudi_store_sales -maxdepth 2 -type f -printf '%p %s bytes\n'
      - name: Inspect downloaded dataset
        env:
          SAUDI_STORE_DIR: /tmp/saudi_store_sales
        run: python scripts/inspect_external_saudi_store_sales.py
      - name: Show inspection summary
        run: cat reports/external_saudi_store_sales_inspection/inspection_summary.md
      - name: Upload inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: external-saudi-store-sales-inspection
          path: reports/external_saudi_store_sales_inspection/
      - name: Persist inspection evidence only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/external_saudi_store_sales_inspection
          git diff --cached --quiet || git commit -m "Persist Saudi store sales inspection"
          git push
