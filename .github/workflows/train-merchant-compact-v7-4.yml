name: Train Merchant Compact V7.4

on:
  push:
    branches: [main]
    paths:
      - 'scripts/train_merchant_compact_v7_4.py'
      - '.github/workflows/train-merchant-compact-v7-4.yml'
      - 'data/merchant_v7_1/merchant_feature_panel_v7_1.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-v7-4:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements-training.txt
          pip install xgboost==3.0.2 catboost==1.2.8
      - name: Train V7.4 compact models
        run: python scripts/train_merchant_compact_v7_4.py
      - name: Show V7.4 summary
        run: cat reports/merchant_compact_v7_4/development_summary.md
      - name: Upload V7.4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: sales-sentinel-v7-4-evidence
          path: |
            reports/merchant_compact_v7_4/
            models/merchant_compact_v7_4/
      - name: Persist V7.4 evidence and model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/merchant_compact_v7_4 models/merchant_compact_v7_4
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Persist Sales Sentinel V7.4 compact evidence'
            git push
          fi
