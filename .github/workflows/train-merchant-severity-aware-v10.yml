name: Train Merchant Severity Aware V10

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/train_merchant_severity_aware_v10.py'
      - '.github/workflows/train-merchant-severity-aware-v10.yml'

jobs:
  train-v10:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn xgboost catboost
      - name: Train V10 severity-aware model
        run: python scripts/train_merchant_severity_aware_v10.py
      - name: Show V10 summary
        run: cat reports/merchant_severity_aware_v10/development_summary.md
      - name: Upload V10 evidence
        uses: actions/upload-artifact@v4
        with:
          name: merchant-severity-aware-v10
          path: reports/merchant_severity_aware_v10/
      - name: Persist V10 evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/merchant_severity_aware_v10
          git diff --cached --quiet || git commit -m "Persist V10 severity-aware evidence"
          git push
