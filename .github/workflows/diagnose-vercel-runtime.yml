name: Diagnose Vercel Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-vercel-runtime.yml'

permissions:
  contents: read
  deployments: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve latest Vercel deployment URLs
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          deployments = get_json(f'https://api.github.com/repos/{repo}/deployments?per_page=30')
          wanted = {
              'Production – sales-sentinel': 'main',
              'Production – sales-sentinel-ppgm': 'ppgm',
          }
          found = {}
          for dep in deployments:
              env = dep.get('environment')
              if env not in wanted or wanted[env] in found:
                  continue
              statuses = get_json(dep['statuses_url'])
              if statuses:
                  found[wanted[env]] = statuses[0].get('environment_url') or statuses[0].get('target_url')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              for key in ('main', 'ppgm'):
                  value = found.get(key, '')
                  print(f'{key}={value}', file=f)
                  print(f'{key.upper()}_URL={value}')
          PY

      - name: Probe both deployments
        shell: bash
        env:
          MAIN_URL: ${{ steps.resolve.outputs.main }}
          PPGM_URL: ${{ steps.resolve.outputs.ppgm }}
        run: |
          set +e
          probe() {
            label="$1"
            base="$2"
            echo "===== $label ====="
            if [ -z "$base" ]; then
              echo "NO_URL"
              return
            fi
            for path in / /healthz; do
              url="${base%/}${path}"
              echo "--- $url"
              code=$(curl -L -sS -o /tmp/body.txt -w '%{http_code}' --connect-timeout 15 --max-time 30 "$url")
              rc=$?
              echo "CURL_RC=$rc HTTP_STATUS=$code"
              head -c 800 /tmp/body.txt || true
              echo
            done
          }
          probe "sales-sentinel" "$MAIN_URL"
          probe "sales-sentinel-ppgm" "$PPGM_URL"
