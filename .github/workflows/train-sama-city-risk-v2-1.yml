name: Train SAMA City Risk v2.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/sama_pos/sama_city_weekly_value_count_2020_2025.csv'
      - 'scripts/train_sama_city_risk_v2_1.py'
      - '.github/workflows/train-sama-city-risk-v2-1.yml'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          pip install -r requirements-training.txt
          pip install xgboost
      - name: Verify city source audit
        run: |
          python - <<'PY'
          import json
          d=json.load(open('reports/sama_city_v2_1/history_audit.json',encoding='utf-8'))
          assert d['all_checks_passed'] is True
          PY
      - name: Train frozen city market-risk model
        run: python scripts/train_sama_city_risk_v2_1.py
      - name: Show development evidence
        run: cat reports/sama_city_v2_1/development_summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: sama-city-risk-v2-1-frozen
          path: |
            reports/sama_city_v2_1/**
            models/sama_city_v2_1/**
          retention-days: 30
      - name: Persist frozen model and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/sama_city_v2_1 models/sama_city_v2_1
          git diff --cached --quiet || git commit -m 'ml: persist frozen SAMA city market-risk v2.1 model'
          git pull --rebase origin main
          git push origin HEAD:main
