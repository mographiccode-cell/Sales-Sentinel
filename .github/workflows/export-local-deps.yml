name: Export Local Python Dependencies

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-local-deps.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install portable dependencies
        run: |
          mkdir -p deps
          python -m pip install --target deps Flask==3.1.2 Werkzeug==3.1.8 blinker==1.9.0
      - uses: actions/upload-artifact@v4
        with:
          name: sales-sentinel-local-deps
          path: deps
          compression-level: 9
