name: Diagnose Saudi Panel v1.4.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose_saudi_panel_v1_4_1.py'
      - '.github/workflows/diagnose-saudi-panel-v1-4-1.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements-training.txt
          pip install xgboost

      - name: Rebuild verified v1.3.1 source microdata
        run: python scripts/build_saudi_sama_calibrated_v1_3_safe.py

      - name: Diagnose exact v1.4.1 panel
        run: python scripts/diagnose_saudi_panel_v1_4_1.py

      - name: Show diagnosis
        run: cat reports/saudi_v1_4/panel_diagnosis_v1_4_1.json

      - name: Persist diagnosis
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/saudi_v1_4/panel_diagnosis_v1_4_1.json
          git diff --cached --quiet || git commit -m 'debug: persist Saudi panel v1.4.1 diagnosis'
          git pull --rebase origin main
          git push origin HEAD:main
