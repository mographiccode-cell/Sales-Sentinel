name: Train Merchant + SAMA Hybrid v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/train_merchant_sama_hybrid_v4.py'
      - 'scripts/run_merchant_sama_hybrid_v4_0_1.py'
      - '.github/workflows/train-merchant-sama-hybrid-v4.yml'
      - 'scripts/build_saudi_sama_calibrated_v1_3.py'
      - 'scripts/build_saudi_sama_calibrated_v1_3_safe.py'
      - 'data/sama_pos/sama_sector_walkforward_forecasts_2023_2025.csv'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install training dependencies
        run: pip install -r requirements-training.txt
      - name: Rebuild full 1,049,042-row Saudi-localized microdata
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python scripts/build_saudi_sama_calibrated_v1_3_safe.py
      - name: Train Merchant + SAMA Hybrid v4.0.1
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python scripts/run_merchant_sama_hybrid_v4_0_1.py
      - name: Show evidence
        if: always()
        run: |
          test -f reports/merchant_sama_hybrid_v4/development_summary.md && cat reports/merchant_sama_hybrid_v4/development_summary.md || true
          test -f reports/merchant_sama_hybrid_v4/development_report.json && cat reports/merchant_sama_hybrid_v4/development_report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sales-sentinel-merchant-sama-hybrid-v4
          path: |
            reports/merchant_sama_hybrid_v4/**
            models/merchant_sama_hybrid_v4/**
            data/merchant_v4/**
          if-no-files-found: warn
          retention-days: 90
      - name: Restore regenerated legacy files and remove large source artifact
        if: always()
        run: |
          rm -f artifacts/saudi_v1_3/saudi_localized_transactions_v1_3_sama.csv.gz || true
          git restore data/saudi_v1_3 reports/saudi_v1_3 models/saudi_v1_3 2>/dev/null || true
          git clean -fd artifacts/saudi_v1_3 .saudi_v1_2_work data/saudi_v1_2 reports/saudi_v1_2 models/saudi_v1_2 artifacts/saudi_v1_2 2>/dev/null || true
      - name: Persist compact v4 evidence/model
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/merchant_sama_hybrid_v4 models/merchant_sama_hybrid_v4 data/merchant_v4 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'model: persist Sales Sentinel Merchant + SAMA Hybrid v4 evidence'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Enforce scientific acceptance gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/merchant_sama_hybrid_v4/development_report.json')
          d=json.loads(p.read_text())
          assert d.get('all_gates_passed') is True, json.dumps(d, indent=2)
          PY
