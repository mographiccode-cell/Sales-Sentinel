# Verification trigger for exact-main local screenshots — final data fixes
name: Local evidence source bundle

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/local-evidence-bundle.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/local-evidence-bundle.yml'

permissions:
  contents: write

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create exact main source bundle
        run: |
          mkdir -p docs/evidence
          zip -r /tmp/sales-sentinel-main.zip . \
            -x '.git/*' '.venv/*' '__pycache__/*' '*.pyc' \
               'docs/evidence/source_bundle.b64'
          base64 -w 0 /tmp/sales-sentinel-main.zip > docs/evidence/source_bundle.b64
          sha256sum /tmp/sales-sentinel-main.zip > docs/evidence/source_bundle.sha256
      - name: Prepare offline Flask wheels
        run: |
          mkdir -p /tmp/wheels
          python -m pip download --only-binary=:all: --dest /tmp/wheels \
            Flask==3.1.2 Werkzeug==3.1.3 blinker==1.9.0
      - name: Commit reproducible source evidence
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/evidence/source_bundle.b64 docs/evidence/source_bundle.sha256
          git diff --cached --quiet || git commit -m 'evidence: publish exact main source bundle [skip ci]'
          git push
      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: sales-sentinel-main-source
          path: /tmp/sales-sentinel-main.zip
          retention-days: 7
      - name: Upload offline wheels
        uses: actions/upload-artifact@v4
        with:
          name: sales-sentinel-offline-wheels
          path: /tmp/wheels
          retention-days: 7
