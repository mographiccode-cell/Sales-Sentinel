name: Train Merchant Alert Verifier V8.2

on:
  push:
    paths:
      - 'scripts/train_merchant_alert_verifier_v8_2.py'
      - '.github/workflows/train-merchant-alert-verifier-v8-2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-v8-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas scikit-learn catboost xgboost
      - name: Train V8.2 alert verifier
        run: python scripts/train_merchant_alert_verifier_v8_2.py
      - name: Show V8.2 summary
        run: cat reports/merchant_alert_verifier_v8_2/development_summary.md
      - name: Upload V8.2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: merchant-alert-verifier-v8-2
          path: reports/merchant_alert_verifier_v8_2/
      - name: Persist V8.2 evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/merchant_alert_verifier_v8_2/
          git diff --cached --quiet || git commit -m "Persist V8.2 alert verifier evidence"
          git push
