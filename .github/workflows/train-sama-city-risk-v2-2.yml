name: Train SAMA City Risk v2.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/train_sama_city_risk_v2_2.py'
      - '.github/workflows/train-sama-city-risk-v2-2.yml'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          pip install -r requirements-training.txt
          pip install xgboost
      - name: Verify historical-only city source
        run: |
          python - <<'PY'
          import json
          d=json.load(open('reports/sama_city_v2_1/history_audit.json',encoding='utf-8'))
          assert d['all_checks_passed'] is True
          PY
      - name: Train v2.2 stationary model
        run: python scripts/train_sama_city_risk_v2_2.py
      - name: Verify anti-leakage and show evidence
        run: |
          cat reports/sama_city_v2_2/development_summary.md
          python - <<'PY'
          import json
          d=json.load(open('reports/sama_city_v2_2/development_report.json',encoding='utf-8'))
          assert d['leakage_controls']['fresh_2025_2026_used'] is False
          assert d['leakage_controls']['future_values_features'] is False
          assert d['absolute_level_features_forbidden'] is True
          print(json.dumps({'selected':d['selected'],'triage':d['policy_triage'],'ranking':d['policy_ranking'],'gates':d['gates'],'all':d['all_gates_passed']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sama-city-risk-v2-2-stationary
          path: |
            reports/sama_city_v2_2/**
            models/sama_city_v2_2/**
          retention-days: 30
      - name: Persist frozen v2.2 model and evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/sama_city_v2_2 models/sama_city_v2_2
          git diff --cached --quiet || git commit -m 'ml: persist stationary SAMA city risk v2.2 model'
          git pull --rebase origin main
          git push origin HEAD:main
