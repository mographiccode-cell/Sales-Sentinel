name: Retrain sales decline v1.4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/retrain_sales_decline_v1_4.py'
      - '.github/workflows/retrain-sales-decline-v1-4.yml'
      - 'data/saudi_v1_3/saudi_daily_sama_calibrated_v1_3.csv'

permissions:
  contents: write

jobs:
  diagnose-retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install training dependencies
        run: |
          pip install -r requirements-training.txt
          pip install joblib
      - name: Diagnose and retrain sales decline model
        run: python scripts/retrain_sales_decline_v1_4.py
      - name: Upload retraining evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-sentinel-sales-decline-v1-4
          if-no-files-found: warn
          path: |
            models/saudi_v1_4/**
            reports/saudi_v1_4/**
      - name: Persist model and reports
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/saudi_v1_4 reports/saudi_v1_4
          if ! git diff --cached --quiet; then
            git commit -m 'ml: persist leakage-safe sales decline v1.4 results [skip ci]'
            git push origin main
          fi
