name: Train Merchant Total Hybrid v4.3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/train_merchant_total_hybrid_v4_3.py'
      - 'scripts/run_merchant_total_hybrid_v4_3_1.py'
      - '.github/workflows/train-merchant-total-hybrid-v4-3.yml'
      - 'data/saudi_v1_3/saudi_daily_sama_calibrated_v1_3.csv'
      - 'data/merchant_v4/merchant_sector_daily_features_v4.csv'
      - 'data/merchant_v4_2/rich_weekly_panel_v4_2.csv'

permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -r requirements-training.txt
      - name: Train v4.3.1 merchant total hybrid
        run: python scripts/run_merchant_total_hybrid_v4_3_1.py
      - name: Show evidence
        if: always()
        run: |
          test -f reports/merchant_total_hybrid_v4_3/development_summary.md && cat reports/merchant_total_hybrid_v4_3/development_summary.md || true
          test -f reports/merchant_total_hybrid_v4_3/development_report.json && cat reports/merchant_total_hybrid_v4_3/development_report.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sales-sentinel-merchant-total-hybrid-v4-3
          path: |
            reports/merchant_total_hybrid_v4_3/**
            models/merchant_total_hybrid_v4_3/**
            data/merchant_v4_3/**
          if-no-files-found: warn
          retention-days: 90
      - name: Persist compact evidence/model
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/merchant_total_hybrid_v4_3 models/merchant_total_hybrid_v4_3 data/merchant_v4_3 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'model: persist Sales Sentinel merchant-total hybrid v4.3 evidence'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Enforce development gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('reports/merchant_total_hybrid_v4_3/development_report.json').read_text())
          assert d.get('all_development_gates_passed') is True, json.dumps(d,indent=2)
          PY
