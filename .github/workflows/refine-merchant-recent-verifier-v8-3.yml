name: Refine Merchant Recent Verifier V8.3

on:
  push:
    paths:
      - 'scripts/refine_merchant_recent_verifier_v8_3.py'
      - '.github/workflows/refine-merchant-recent-verifier-v8-3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine-v8-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas scikit-learn catboost xgboost
      - name: Refine V8.3 recent verifier
        run: python scripts/refine_merchant_recent_verifier_v8_3.py
      - name: Show V8.3 summary
        run: cat reports/merchant_recent_verifier_v8_3/development_summary.md
      - name: Upload V8.3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: merchant-recent-verifier-v8-3
          path: reports/merchant_recent_verifier_v8_3/
      - name: Persist V8.3 evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/merchant_recent_verifier_v8_3/
          git diff --cached --quiet || git commit -m "Persist V8.3 recent verifier evidence"
          git push
