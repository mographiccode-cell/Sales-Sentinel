name: Finalize Merchant V8.2

on:
  push:
    paths:
      - 'scripts/finalize_merchant_v8_2.py'
      - '.github/workflows/finalize-merchant-v8-2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-v8-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas scikit-learn catboost xgboost joblib
      - name: Finalize V8.2 candidate
        run: python scripts/finalize_merchant_v8_2.py
      - name: Show final V8.2 summary
        run: cat reports/merchant_v8_2_final/finalization_summary.md
      - name: Upload frozen V8.2 candidate
        uses: actions/upload-artifact@v4
        with:
          name: merchant-v8-2-final-candidate
          path: |
            reports/merchant_v8_2_final/
            models/merchant_v8_2_final/
      - name: Persist final V8.2 evidence and model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/merchant_v8_2_final/ models/merchant_v8_2_final/
          git diff --cached --quiet || git commit -m "Freeze V8.2 development candidate"
          git push
