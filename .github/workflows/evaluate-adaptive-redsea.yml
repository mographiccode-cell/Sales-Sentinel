name: Evaluate Adaptive Forecast on Redsea

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/evaluate_adaptive_forecast_redsea.py'
      - 'app/services/adaptive_forecasting_engine.py'
      - '.github/workflows/evaluate-adaptive-redsea.yml'

permissions:
  contents: write

env:
  PYTHONPATH: .
  REDSEA_XLSX: /tmp/RedSea_Data_Cleaned.xlsx

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download and verify official Mendeley Redsea file
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://data.mendeley.com/public-files/datasets/9c87bd42ct/files/deb8ee07-178b-43b3-8462-ad71ee417edb/file_downloaded' \
            -o "$REDSEA_XLSX"
          test "$(stat -c%s "$REDSEA_XLSX")" -eq 354721
          echo 'dd994d25042e54119babe058820b02e00b3443fe18150b9213f9c6929466a645  /tmp/RedSea_Data_Cleaned.xlsx' | sha256sum -c -
      - name: Run external walk-forward diagnostic
        run: python scripts/evaluate_adaptive_forecast_redsea.py
      - uses: actions/upload-artifact@v4
        with:
          name: adaptive-redsea-forecast-evidence
          path: reports/external_redsea_adaptive_forecast/
          if-no-files-found: error
      - name: Persist evaluation report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/external_redsea_adaptive_forecast
          if git diff --cached --quiet; then
            echo 'No report changes to commit.'
          else
            git commit -m 'Persist Redsea adaptive forecast diagnostic'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
