name: Patch Import Result Semantics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-import-result-semantics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch risk and quality semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/templates/imports/index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
          '''  <div class="ux3-result-bar severity-{{ analysis.severity }}">\n    <div><span class="ux3-status-dot"></span><strong>{{ ('خطر ' ~ severity_label) if locale=='ar' else (severity_label ~ ' risk') }}</strong><span>{{ 'انخفاض متوقع خلال 7 أيام' if locale=='ar' else '7-day decline signal' }}</span></div>''':
          '''  <div class="ux3-result-bar severity-{{ analysis.severity if analysis.decline_probability_supported else 'medium' }}">\n    <div><span class="ux3-status-dot"></span>{% if analysis.decline_probability_supported %}<strong>{{ ('خطر ' ~ severity_label) if locale=='ar' else (severity_label ~ ' risk') }}</strong><span>{{ 'خطر انخفاض خلال 7 أيام وفق V18' if locale=='ar' else 'V18 7-day decline risk' }}</span>{% else %}<strong>{{ 'توقع قيمة المبيعات' if locale=='ar' else 'Sales value forecast' }}</strong><span>{{ 'خطر الانخفاض غير متاح لهذه البيانات' if locale=='ar' else 'Validated decline risk unavailable for this data' }}</span>{% endif %}</div>''',
          '''    <article class="risk"><small>{{ 'احتمال الانخفاض' if locale=='ar' else 'Decline probability' }}</small><strong>{{ '%.1f%%'|format(analysis.risk_probability_pct) }}</strong><span>{{ 'حد القرار' if locale=='ar' else 'threshold' }} {{ '%.1f%%'|format(analysis.decision_threshold_pct or 0) }}</span></article>''':
          '''    <article class="risk"><small>{{ 'احتمال الانخفاض' if locale=='ar' else 'Decline probability' }}</small>{% if analysis.decline_probability_supported %}<strong>{{ '%.1f%%'|format(analysis.risk_probability_pct) }}</strong><span>{{ 'حد القرار' if locale=='ar' else 'threshold' }} {{ '%.1f%%'|format(analysis.decision_threshold_pct or 0) }}</span>{% else %}<strong>—</strong><span>{{ 'غير متاح — يلزم V18' if locale=='ar' else 'Unavailable — V18 required' }}</span>{% endif %}</article>''',
          '''<td><span class="ux3-risk-pill">{{ '%.1f%%'|format(item.decline_probability_pct) }}</span></td>''':
          '''<td>{% if analysis.decline_probability_supported %}<span class="ux3-risk-pill">{{ '%.1f%%'|format(item.decline_probability_pct) }}</span>{% else %}<span class="ux3-risk-pill">—</span>{% endif %}</td>''',
          '''      <article><small>{{ 'تغطية النطاق' if locale=='ar' else 'Interval coverage' }}</small><strong>{{ '%.1f%%'|format(analysis.interval_coverage_pct) }}</strong><span>{{ 'اختبار زمني' if locale=='ar' else 'temporal test' }}</span></article>''':
          '''      <article><small>{{ 'نقاط الاختبار الزمني' if locale=='ar' else 'Backtest points' }}</small><strong>{{ analysis.forecast_backtest_points }}</strong><span>{{ 'اختيار بأقل WAPE' if locale=='ar' else 'lowest-WAPE selection' }}</span></article>'''
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('Expected template fragment not found: '+old[:90])
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit semantic fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/templates/imports/index.html
          git diff --cached --quiet || git commit -m 'fix: distinguish validated decline risk in upload result'
          git pull --rebase origin main
          git push origin HEAD:main
