name: Train Merchant Sector Breadth V12

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/train_merchant_sector_breadth_v12.py'
      - '.github/workflows/train-merchant-sector-breadth-v12.yml'

jobs:
  train-v12:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas scikit-learn xgboost catboost
      - name: Train V12 sector breadth verifier
        run: python scripts/train_merchant_sector_breadth_v12.py
      - name: Show V12 summary
        run: cat reports/merchant_sector_breadth_v12/development_summary.md
      - name: Upload V12 evidence
        uses: actions/upload-artifact@v4
        with:
          name: merchant-sector-breadth-v12
          path: reports/merchant_sector_breadth_v12/
      - name: Persist V12 evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/merchant_sector_breadth_v12
          git diff --cached --quiet || git commit -m "Persist V12 sector breadth evidence"
          git push
