name: Validate Sales Sentinel v3.3 Corrected

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/test_v3_3_semi_synthetic_sama_v2.py'
      - '.github/workflows/validate-sales-sentinel-v3-3-corrected.yml'
      - 'models/sama_city_v3_3/**'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          pip install -r requirements-training.txt
          pip install xgboost
      - name: Corrected fresh semi-synthetic SAMA validation
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: python scripts/test_v3_3_semi_synthetic_sama_v2.py
      - name: Show evidence
        run: cat reports/sama_city_v3_3/semi_synthetic_corrected_fresh_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: sales-sentinel-v3-3-corrected-validation
          path: |
            reports/sama_city_v3_3/semi_synthetic_corrected_fresh_report.json
            tests/fixtures/sama_city_v3_3_semi_synthetic_v2/**
          retention-days: 90
      - name: Persist evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/sama_city_v3_3/semi_synthetic_corrected_fresh_report.json tests/fixtures/sama_city_v3_3_semi_synthetic_v2
          git diff --cached --quiet || git commit -m 'test: persist corrected v3.3 semi-synthetic validation'
          git pull --rebase origin main
          git push origin HEAD:main
