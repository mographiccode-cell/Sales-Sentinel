name: Saudi v1.3 SAMA-calibrated dataset and models

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_saudi_sama_calibrated_v1_3.py'
      - '.github/workflows/saudi-v1-3-sama-calibrated.yml'

permissions:
  contents: write

jobs:
  build-audit-train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install training dependencies
        run: |
          pip install -r requirements-training.txt
          pip install requests joblib
      - name: Rebuild, SAMA-calibrate, audit, and train
        run: python scripts/build_saudi_sama_calibrated_v1_3.py
      - name: Upload complete v1.3 evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sales-sentinel-saudi-v1-3-sama-calibrated
          if-no-files-found: warn
          path: |
            data/saudi_v1_3/**
            reports/saudi_v1_3/**
            models/saudi_v1_3/**
            artifacts/saudi_v1_3/**
      - name: Persist review-sized v1.3 artifacts
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/saudi_v1_3 reports/saudi_v1_3 models/saudi_v1_3
          if ! git diff --cached --quiet; then
            git commit -m 'data: persist Saudi v1.3 SAMA-calibrated audit and models [skip ci]'
            git push origin main
          fi
