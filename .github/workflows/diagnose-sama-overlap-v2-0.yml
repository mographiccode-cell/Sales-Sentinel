name: Diagnose SAMA Holdout Overlap v2.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose_sama_overlap_v2_0.py'
      - '.github/workflows/diagnose-sama-overlap-v2-0.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          pip install requests==2.32.5 pandas==2.2.3 numpy==2.2.4
      - name: Download archive reports
        run: |
          python scripts/scrape_sama_recent_pos_reports_v2_0.py
          python scripts/scrape_sama_gap_2025_v2_0.py
      - name: Diagnose overlaps
        run: python scripts/diagnose_sama_overlap_v2_0.py
      - name: Persist diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/sama_recent_v2_0/overlap_diagnostics.json
          git diff --cached --quiet || git commit -m 'data: persist SAMA overlap diagnostics'
          git pull --rebase origin main
          git push origin HEAD:main
