name: Diagnose SAMA City Risk Shift v2.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose_sama_city_risk_shift_v2_1.py'
      - '.github/workflows/diagnose-sama-city-risk-shift-v2-1.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          pip install -r requirements-training.txt
          pip install xgboost
      - name: Diagnose frozen model shift
        run: python scripts/diagnose_sama_city_risk_shift_v2_1.py
      - name: Persist diagnostics only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/sama_city_v2_1/shift_diagnostics.json
          git diff --cached --quiet || git commit -m 'ml: persist v2.1 fresh shift diagnostics'
          git pull --rebase origin main
          git push origin HEAD:main
