name: Stress Test SAMA City Risk v2.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/stress_test_sama_city_risk_v2_2.py'
      - '.github/workflows/stress-test-sama-city-risk-v2-2.yml'

permissions:
  contents: write

jobs:
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          pip install -r requirements-training.txt
          pip install xgboost
      - name: Verify v2.2 was frozen without fresh rows
        run: |
          python - <<'PY'
          import json
          d=json.load(open('reports/sama_city_v2_2/development_report.json',encoding='utf-8'))
          assert d['leakage_controls']['fresh_2025_2026_used'] is False
          assert d['absolute_level_features_forbidden'] is True
          assert d['all_gates_passed'] is True
          PY
      - name: Run post-diagnosis stress test with frozen weights and thresholds
        run: python scripts/stress_test_sama_city_risk_v2_2.py
      - name: Show evidence
        run: cat reports/sama_city_v2_2/post_diagnosis_stress_summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: sama-city-risk-v2-2-stress
          path: reports/sama_city_v2_2/**
          retention-days: 30
      - name: Persist stress evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/sama_city_v2_2/post_diagnosis_stress_test.json reports/sama_city_v2_2/post_diagnosis_stress_summary.md
          git diff --cached --quiet || git commit -m 'ml: persist v2.2 post-diagnosis stress test'
          git pull --rebase origin main
          git push origin HEAD:main
