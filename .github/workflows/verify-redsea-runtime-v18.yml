name: Verify Real Redsea Runtime V18

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/verify_redsea_runtime_v18.py'
      - 'app/services/sales_importer.py'
      - 'app/services/tabular_upload.py'
      - 'app/services/portable_decline_engine.py'
      - 'models/sales_sentinel_portable_v18.json.gz'
      - 'requirements.txt'
      - '.github/workflows/verify-redsea-runtime-v18.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      REDSEA_XLSX: /tmp/RedSea_Data_Cleaned.xlsx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Download official Mendeley Redsea file
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://data.mendeley.com/public-files/datasets/9c87bd42ct/files/deb8ee07-178b-43b3-8462-ad71ee417edb/file_downloaded' \
            -o "$REDSEA_XLSX"
          test "$(stat -c%s "$REDSEA_XLSX")" -eq 354721
          echo 'dd994d25042e54119babe058820b02e00b3443fe18150b9213f9c6929466a645  /tmp/RedSea_Data_Cleaned.xlsx' | sha256sum -c -
      - name: Run XLSX to SQLite to V18 verification
        run: python scripts/verify_redsea_runtime_v18.py
      - name: Show evidence summary
        run: cat reports/external_redsea_runtime_v18/runtime_summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: redsea-runtime-v18-evidence
          path: reports/external_redsea_runtime_v18/
          if-no-files-found: error
      - name: Persist verified evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/external_redsea_runtime_v18
          if git diff --cached --quiet; then
            echo 'No evidence changes to commit.'
          else
            git commit -m 'Persist real Redsea V18 runtime evidence'
            git push
          fi
